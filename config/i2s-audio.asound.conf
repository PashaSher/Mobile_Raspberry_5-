# Шаблон ALSA для I2S (копируется скриптом setup_i2s_audio.sh в /etc/asound.conf).
# См. scripts/setup_i2s_audio.sh

pcm.i2s_mic {
    @func refer
    defaults {
        name {
            @func card
            card {
                @func search
                search {
                    string "voice"
                    error "I2S voicehat card not found"
                }
            }
        }
    }
}

pcm.i2s_spk {
    @func refer
    defaults {
        name {
            @func card
            card {
                @func search
                search {
                    string "voice"
                    error "I2S voicehat card not found"
                }
            }
        }
    }
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "i2s_spk"
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "dmixer"
    }
    capture.pcm {
        type plug
        slave.pcm "i2s_mic"
    }
}

ctl.!default {
    @func refer
    defaults {
        name {
            @func card
            card {
                @func search
                search {
                    string "voice"
                    error "I2S voicehat card not found"
                }
            }
        }
    }
}
